<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merfin - Chat</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="../css/chat-history.css">
    <style>
        /* Animações para timeline de pensamentos */
        .timeline-event {
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .timeline-event.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .timeline-event.fade-out {
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease-out;
        }
        
        /* Efeito de destaque no pensamento atual */
        .timeline-event.current .event-label {
            font-weight: 500;
            color: #a8dadc;
        }
        
        /* Container de timeline para 2 eventos visíveis */
        .timeline-container {
            min-height: 120px;
            max-height: none;
            overflow: visible;
            position: relative;
        }
        
        /* Bolinhas animadas */
        .wave-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .wave-dots i {
            font-size: 8px;
            color: #a8dadc;
            animation: wave 1.4s ease-in-out infinite;
        }
        
        .wave-dots i:nth-child(1) {
            animation-delay: 0s;
        }
        
        .wave-dots i:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .wave-dots i:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes wave {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-8px);
                opacity: 0.5;
            }
        }
        
        /* Spinner inicial de loading */
        .initial-loading {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 60px;
            padding-left: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>

    <!-- Botão Histórico Fixo -->
    <button id="btn-historico" class="btn-historico" onclick="abrirModalHistorico()">
        <i class="fas fa-history"></i>
    </button>

    <!-- Botão Novo Chat -->
    <button id="btn-novo-chat" class="btn-novo-chat" onclick="iniciarNovoChat()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Conteúdo do chat -->
    <div class="content" id="content">
        <main class="chat-container">
            <section id="messages" class="messages" aria-live="polite"></section>
            <div id="chat-placeholder" class="chat-placeholder">
                <div class="placeholder-content">
                    Pergunte sobre suas finanças
                </div>
            </div>
        </main>

        <form id="chat-form" class="input-area" autocomplete="off">
            <div class="input-wrapper">
                <textarea id="message-input" placeholder="Escreva sua mensagem..." aria-label="Mensagem"></textarea>
                <button type="submit" id="send-btn" aria-label="Enviar"><i class="fas fa-paper-plane"></i></button>
            </div>
        </form>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>

    <script>
    // Configurar Marked.js para melhor renderização
    if (typeof marked !== 'undefined') {
        marked.setOptions({
            breaks: true,       // Quebras de linha automáticas
            gfm: true,          // GitHub Flavored Markdown
            tables: true,       // Suporte a tabelas
            sanitize: false,    // Permitir HTML (use com cuidado)
            smartLists: true,   // Listas inteligentes
            smartypants: true   // Tipografia inteligente
        });
    }

    // Função para renderizar Markdown
    function renderMarkdown(text) {
        if (typeof marked === 'undefined') {
            console.warn('Marked.js não carregado, retornando texto plano');
            return text;
        }
        
        try {
            // Renderizar markdown
            let html = marked.parse(text);
            
            // Wrapper com classe para estilos
            return `<div class="markdown-content">${html}</div>`;
        } catch (error) {
            console.error('Erro ao renderizar markdown:', error);
            return `<div class="markdown-content">${text}</div>`;
        }
    }

    // Inicializar histórico de conversas
    initChatHistory();
    
    (function () {
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messages = document.getElementById('messages');
        const sendBtn = document.getElementById('send-btn');
        
        let sessionId = localStorage.getItem('merfin_chat_session') || 
                        'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('merfin_chat_session', sessionId);
        
        // Variável para manter o ID da conversa atual (essencial para resumos)
        let conversaAtualId = null;

        // Adicionar mensagem do usuário
        function addUserMessage(text) {
            const el = document.createElement('div');
            el.className = 'message user';
            el.innerText = text;
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
            
            // Esconder placeholder quando há mensagens
            toggleChatPlaceholder(false);
        }

        // Criar elemento de "pensando"
        function showThinkingIndicator() {
            const thinkingEl = document.createElement('div');
            thinkingEl.className = 'thinking-container';
            thinkingEl.id = 'thinking-indicator';
            thinkingEl.innerHTML = `
                <div class="initial-loading" id="initial-loading">
                    <div class="wave-dots">
                        <i class="fa-solid fa-circle"></i>
                        <i class="fa-solid fa-circle"></i>
                        <i class="fa-solid fa-circle"></i>
                    </div>
                </div>
                <div class="progress-timeline" id="progress-timeline" style="display: none;">
                    <div class="timeline-container" id="timeline-events"></div>
                </div>
            `;
            messages.appendChild(thinkingEl);
            messages.scrollTop = messages.scrollHeight;
            return thinkingEl;
        }

        // Adicionar evento à timeline
        function addTimelineEvent(eventData) {
            // Remover spinner inicial na primeira execução
            const initialLoading = document.getElementById('initial-loading');
            const progressTimeline = document.getElementById('progress-timeline');
            if (initialLoading && progressTimeline) {
                initialLoading.style.display = 'none';
                progressTimeline.style.display = 'flex';
            }
            
            const timeline = document.getElementById('timeline-events');
            if (!timeline) return;

            const eventId = `event-${eventData.id}`;
            let eventEl = document.getElementById(eventId);

            // Se evento já existe, apenas atualizar status
            if (eventEl) {
                if (eventData.status === 'done') {
                    eventEl.classList.add('done');
                    eventEl.classList.remove('current');
                    const icon = eventEl.querySelector('.event-icon');
                    if (icon) {
                        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                    }
                }
                return;
            }

            // Gerenciar limite de 2 eventos visíveis
            const existingEvents = timeline.querySelectorAll('.timeline-event');
            if (existingEvents.length >= 2) {
                // Remover o primeiro com fade out
                const firstEvent = existingEvents[0];
                firstEvent.classList.add('fade-out');
                setTimeout(() => {
                    firstEvent.remove();
                }, 300);
            }

            // Criar novo evento
            const eventType = eventData.type || 'main';
            const isMain = eventType === 'main';
            
            eventEl = document.createElement('div');
            eventEl.id = eventId;
            eventEl.className = `timeline-event ${eventType} ${eventData.status}`;
            
            // Adicionar classe 'current' se for running
            if (eventData.status === 'running') {
                eventEl.classList.add('current');
            }
            
            const icon = isMain 
                ? '<i class="fas fa-circle"></i>' 
                : '<i class="fas fa-circle" style="font-size: 8px;"></i>';
            
            // Adicionar bolinhas animadas se for o pensamento atual (running)
            const spinnerHtml = eventData.status === 'running' 
                ? '<span class="wave-dots" style="margin-right: 8px; display: inline-flex;"><i class="fa-solid fa-circle"></i><i class="fa-solid fa-circle"></i><i class="fa-solid fa-circle"></i></span>' 
                : '';
            
            eventEl.innerHTML = `
                <div class="event-line ${isMain ? 'main-line' : 'branch-line'}"></div>
                <div class="event-icon">${icon}</div>
                <div class="event-label">${spinnerHtml}${eventData.label}</div>
            `;
            
            timeline.appendChild(eventEl);
            
            // Animar entrada lateral
            setTimeout(() => {
                eventEl.classList.add('visible');
            }, 50);
            
            // Auto-scroll
            messages.scrollTop = messages.scrollHeight;
        }

        // Remover indicador de "pensando"
        function removeThinkingIndicator() {
            const thinkingEl = document.getElementById('thinking-indicator');
            if (thinkingEl) {
                thinkingEl.remove();
            }
        }

        // Adicionar mensagem do bot com efeito de digitação e suporte a Markdown
        function addBotMessageTyping(text) {
            removeThinkingIndicator();
            
            // Esconder placeholder quando há mensagens
            toggleChatPlaceholder(false);
            
            const el = document.createElement('div');
            el.className = 'message bot typing';
            messages.appendChild(el);
            
            // Renderizar markdown primeiro
            const markdownHtml = renderMarkdown(text);
            
            // Criar elemento temporário para extrair apenas o texto para efeito de digitação
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = markdownHtml;
            const plainText = tempDiv.textContent || tempDiv.innerText || text;
            
            // Dividir em palavras para efeito de digitação
            const words = plainText.split(' ');
            let currentIndex = 0;
            
            // Mostrar 3 palavras por vez (efeito de digitação)
            const typingInterval = setInterval(() => {
                const wordsToShow = words.slice(currentIndex, currentIndex + 3);
                
                if (wordsToShow.length > 0) {
                    if (currentIndex === 0) {
                        el.innerText = wordsToShow.join(' ');
                    } else {
                        el.innerText += ' ' + wordsToShow.join(' ');
                    }
                    
                    currentIndex += 3;
                    messages.scrollTop = messages.scrollHeight;
                } else {
                    // Finalizar: remover classe typing e aplicar markdown completo
                    clearInterval(typingInterval);
                    el.classList.remove('typing');
                    el.innerHTML = markdownHtml; // Aplicar markdown renderizado
                    messages.scrollTop = messages.scrollHeight;
                }
            }, 150); // 150ms entre cada grupo de 3 palavras
        }

        // Desabilitar input durante processamento
        function setLoading(isLoading) {
            input.disabled = isLoading;
            sendBtn.disabled = isLoading;
            
            if (isLoading) {
                sendBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                sendBtn.classList.add('clicked');
            } else {
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                sendBtn.classList.remove('clicked');
            }
        }

        // Enviar mensagem para a API e exibir pensamentos reais do agente
        async function sendMessage(messageText) {
            try {
                setLoading(true);
                showThinkingIndicator();

                // Obter token de autenticação
                const token = localStorage.getItem('merfin_token');
                if (!token) {
                    throw new Error('Você precisa estar autenticado para usar o chat');
                }

                // Fazer requisição para obter resposta e pensamentos
                const response = await fetch('http://localhost:5001/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        message: messageText,
                        conversaId: conversaAtualId
                    })
                });

                const data = await response.json();
                
                console.log('📦 Resposta recebida:', data);
                console.log('💭 Pensamentos:', data.thoughts);

                if (data.success && data.response) {
                    // Exibir pensamentos reais do agente (se houver)
                    if (data.thoughts && data.thoughts.length > 0) {
                        console.log(`✅ Exibindo ${data.thoughts.length} pensamentos`);
                        await displayThoughts(data.thoughts);
                    } else {
                        console.log('⚠️ Nenhum pensamento recebido - usando fallback');
                        // Fallback: remover indicador se não houver pensamentos
                        removeThinkingIndicator();
                    }
                    
                    addBotMessageTyping(data.response);
                    
                    // Atualizar conversaId retornado pelo servidor
                    if (data.conversaId) {
                        conversaAtualId = data.conversaId;
                        console.log('📌 Conversa ID:', conversaAtualId);
                    }
                    
                    // Salvar mensagens no histórico
                    await salvarMensagemNaConversa('user', messageText);
                    await salvarMensagemNaConversa('assistant', data.response, data.debug?.sectionsUsed, data.debug?.timeframe);
                } else {
                    throw new Error(data.error || 'Erro ao processar mensagem');
                }

            } catch (error) {
                console.error('Erro no chat:', error);
                removeThinkingIndicator();
                addBotMessageTyping('Desculpe, tive um problema ao processar sua mensagem. Verifique se o servidor está rodando e tente novamente. 😔');
            } finally {
                setLoading(false);
            }
        }

        // Exibir pensamentos reais do agente
        async function displayThoughts(thoughts) {
            for (let i = 0; i < thoughts.length; i++) {
                const thought = thoughts[i];
                
                // Adicionar com status "running"
                addTimelineEvent({
                    id: thought.id,
                    label: thought.text,
                    type: thought.type,
                    status: 'running'
                });
                
                // Delay realista (30% mais lento)
                const delay = thought.type === 'main' ? 520 : 325;
                await new Promise(resolve => setTimeout(resolve, delay));
                
                // Marcar como "done"
                addTimelineEvent({
                    id: thought.id,
                    label: thought.text,
                    type: thought.type,
                    status: 'done'
                });
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        // Handler do formulário
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const txt = input.value.trim();
            if (!txt || input.disabled) return;
            
            addUserMessage(txt);
            input.value = '';
            input.style.height = '120px'; // Resetar altura para inicial
            sendMessage(txt);
        });

        // Ctrl/Cmd + Enter enviar
        input.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // Auto-resize do textarea
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.max(Math.min(this.scrollHeight, 400), 120) + 'px';
        });
    })();
    </script>

    <!-- Modal de Autenticação -->
    <div id="auth-modal" class="auth-modal">

                <button type="button" class="auth-tab active" id="tab-login">Login</button>
                <button type="button" class="auth-tab" id="tab-cadastro">Cadastro</button>

            <form id="login-form" class="auth-form">

            </form>
            
            <!-- Formulário de Cadastro -->
            <form id="cadastro-form" class="auth-form" style="display: none;">

                    <label for="cadastro-nome">Nome</label>
                    <input type="text" id="cadastro-nome" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-email">Email</label>
                    <input type="email" id="cadastro-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="cadastro-confirmar-senha" placeholder="Digite a senha novamente" required>
                </div>
                
                <!-- Seleção de Planos -->
                <div class="planos-cadastro">

                        <div class="plano-card-cadastro" data-plano="mensal">
                            <div class="plano-radio">
                                <input type="radio" name="plano" id="plano-mensal" value="mensal" required>
                                <label for="plano-mensal">
                                    <div class="plano-nome">Plano Mensal</div>
                                    <div class="plano-preco">R$ 20,00<span>/mês</span></div>
                                    <ul class="plano-recursos-mini">
                                        <li>✅ Gestão financeira</li>
                                        <li>✅ Chat com IA</li>
                                        <li>✅ Relatórios mensais</li>
                                    </ul>
                                </label>
                            </div>
                        </div>
                        
                        <div class="plano-card-cadastro destaque" data-plano="anual">
                            <div class="plano-radio">
                                <input type="radio" name="plano" id="plano-anual" value="anual" required checked>
                                <label for="plano-anual">
                                    <div class="plano-nome">Plano Anual</div>
                                    <div class="plano-preco">R$ 190,00<span>/ano</span></div>
                                    <div class="plano-economia">💰 Economize R$ 50,00</div>
                                    <ul class="plano-recursos-mini">
                                        <li>✅ Tudo do Mensal</li>
                                        <li>✅ Suporte prioritário</li>
                                        <li>✅ Relatórios avançados</li>
                                    </ul>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-auth">Efetuar Pagamento</button>
            </form>
        </div>
    </div>
</body>
