<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Finanças</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121920; /* Cor de fundo da página */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .chart-container {
            background-color: #1a222a; /* Cor do card */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 400px;
        }

        h2 {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .dropdown {
            background: #2a343e;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>Suas Financias</h2>
    <div class="dropdown">Outubro 2023 ▾</div>
    <canvas id="financeChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('financeChart').getContext('2d');

    // Criando os gradientes de preenchimento
    const gradientReceita = ctx.createLinearGradient(0, 0, 0, 400);
    gradientReceita.addColorStop(0, 'rgba(75, 192, 212, 0.3)');
    gradientReceita.addColorStop(1, 'rgba(75, 192, 212, 0)');

    const gradientDespesa = ctx.createLinearGradient(0, 0, 0, 400);
    gradientDespesa.addColorStop(0, 'rgba(255, 99, 132, 0.3)');
    gradientDespesa.addColorStop(1, 'rgba(255, 99, 132, 0)');

    const data = {
        labels: ['Seg', 'Ter', 'Tue', 'Qui', 'Sen', 'Sex', 'Sáb', 'Dom'],
        datasets: [
            {
                label: 'Receita',
                data: [2.5, 3.2, 3.8, 3.1, 3.0, 3.5, 3.8, 3.4],
                borderColor: '#4bc0d4',
                backgroundColor: gradientReceita,
                fill: true,
                tension: 0.4, // Suaviza a linha (curva)
                pointRadius: 0 // Esconde os pontos para ficar igual à imagem
            },
            {
                label: 'Despesa',
                data: [1.8, 2.2, 2.5, 2.0, 1.8, 2.1, 2.3, 2.6],
                borderColor: '#e74c3c',
                backgroundColor: gradientDespesa,
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }
        ]
    };

    const config = {
        type: 'line',
        data: data,
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: '#ccc',
                        usePointStyle: true,
                        pointStyle: 'line'
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 4,
                    grid: { color: '#2a343e' },
                    ticks: { color: '#888' }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#888' }
                }
            }
        }
    };

    new Chart(ctx, config);
</script>

</body>
</html>
