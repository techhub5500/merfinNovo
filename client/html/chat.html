    <style>
        /* Animações para timeline de pensamentos */
        .timeline-event {
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .timeline-event.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .timeline-event.fade-out {
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease-out;
        }
        
        /* Efeito de destaque no pensamento atual */
        .timeline-event.current .event-label {
            font-weight: 500;
            color: #a8dadc;
        }
        
        /* Container de timeline para 2 eventos visíveis */
        .timeline-container {
            min-height: 120px;
            max-height: none;
            overflow: visible;
            position: relative;
        }
        
        /* Bolinhas animadas */
        .wave-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .wave-dots i {
            font-size: 8px;
            color: #a8dadc;
            animation: wave 1.4s ease-in-out infinite;
        }
        
        .wave-dots i:nth-child(1) {
            animation-delay: 0s;
        }
        
        .wave-dots i:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .wave-dots i:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes wave {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-8px);
                opacity: 0.5;
            }
        }
        
        /* Spinner inicial de loading */
        .initial-loading {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 60px;
            padding-left: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* finance-card styles moved to chat.css */
    </style>

    <script>
    // Sistema para esconder placeholder ao digitar
    document.addEventListener('DOMContentLoaded', function() {
        const messageInput = document.getElementById('message-input');
        const chatPlaceholder = document.getElementById('chat-placeholder');
        
        if (messageInput && chatPlaceholder) {
            messageInput.addEventListener('input', function() {
                const messages = document.getElementById('messages');
                
                // Esconder placeholder SOMENTE se está digitando
                if (this.value.trim().length > 0) {
                    chatPlaceholder.style.display = 'none';
                } else {
                    // Mostrar placeholder se input vazio E sem mensagens
                    if (messages && messages.children.length === 0) {
                        chatPlaceholder.style.display = 'flex';
                    }
                }
            });
        }
    });
    
    // Configurar Marked.js para melhor renderização
    if (typeof marked !== 'undefined') {
        marked.setOptions({
            breaks: true,       // Quebras de linha automáticas
            gfm: true,          // GitHub Flavored Markdown
            tables: true,       // Suporte a tabelas
            sanitize: false,    // Permitir HTML (use com cuidado)
            smartLists: true,   // Listas inteligentes
            smartypants: true   // Tipografia inteligente
        });
    }

    // Função para renderizar Markdown (GLOBAL para permitir MRM substituir)
    window.renderMarkdown = function(text) {
        if (typeof marked === 'undefined') {
            console.warn('Marked.js não carregado, retornando texto plano');
            return text;
        }
        
        try {
            // Renderizar markdown
            let html = marked.parse(text);
            
            // Wrapper com classe para estilos
            return `<div class="markdown-content">${html}</div>`;
        } catch (error) {
            console.error('Erro ao renderizar markdown:', error);
            return `<div class="markdown-content">${text}</div>`;
        }
    };

    // Inicializar histórico de conversas
    initChatHistory();
    
    (function () {
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messages = document.getElementById('messages');
        const sendBtn = document.getElementById('send-btn');
        
        let sessionId = localStorage.getItem('merfin_chat_session') || 
                        'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('merfin_chat_session', sessionId);
        
        // Variável para manter o ID da conversa atual (essencial para resumos)
        let conversaAtualId = null;

        // Adicionar mensagem do usuário
        function addUserMessage(text) {
            const el = document.createElement('div');
            el.className = 'message user';
            el.innerText = text;
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
            
            // Esconder placeholder quando há mensagens
            toggleChatPlaceholder(false);
        }

        // Criar elemento de "pensando"
        function showThinkingIndicator() {
            const thinkingEl = document.createElement('div');
            thinkingEl.className = 'thinking-container';
            thinkingEl.id = 'thinking-indicator';
            thinkingEl.innerHTML = `
                <div class="initial-loading" id="initial-loading">
                    <div class="wave-dots">
                        <i class="fa-solid fa-circle"></i>
                        <i class="fa-solid fa-circle"></i>
                        <i class="fa-solid fa-circle"></i>
                    </div>
                </div>
                <div class="progress-timeline" id="progress-timeline" style="display: none;">
                    <div class="timeline-container" id="timeline-events"></div>
                </div>
            `;
            messages.appendChild(thinkingEl);
            messages.scrollTop = messages.scrollHeight;
            return thinkingEl;
        }

        // Adicionar evento à timeline
        function addTimelineEvent(eventData) {
            // Remover spinner inicial na primeira execução
            const initialLoading = document.getElementById('initial-loading');
            const progressTimeline = document.getElementById('progress-timeline');
            if (initialLoading && progressTimeline) {
                initialLoading.style.display = 'none';
                progressTimeline.style.display = 'flex';
            }
            
            const timeline = document.getElementById('timeline-events');
            if (!timeline) return;

            const eventId = `event-${eventData.id}`;
            let eventEl = document.getElementById(eventId);

            // Se evento já existe, apenas atualizar status
            if (eventEl) {
                if (eventData.status === 'done') {
                    eventEl.classList.add('done');
                    eventEl.classList.remove('current');
                    const icon = eventEl.querySelector('.event-icon');
                    if (icon) {
                        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                    }
                }
                return;
            }

            // Gerenciar limite de 2 eventos visíveis
            const existingEvents = timeline.querySelectorAll('.timeline-event');
            if (existingEvents.length >= 2) {
                // Remover o primeiro com fade out
                const firstEvent = existingEvents[0];
                firstEvent.classList.add('fade-out');
                setTimeout(() => {
                    firstEvent.remove();
                }, 300);
            }

            // Criar novo evento
            const eventType = eventData.type || 'main';
            const isMain = eventType === 'main';
            
            eventEl = document.createElement('div');
            eventEl.id = eventId;
            eventEl.className = `timeline-event ${eventType} ${eventData.status}`;
            
            // Adicionar classe 'current' se for running
            if (eventData.status === 'running') {
                eventEl.classList.add('current');
            }
            
            const icon = isMain 
                ? '<i class="fas fa-circle"></i>' 
                : '<i class="fas fa-circle" style="font-size: 8px;"></i>';
            
            // Adicionar bolinhas animadas se for o pensamento atual (running)
            const spinnerHtml = eventData.status === 'running' 
                ? '<span class="wave-dots" style="margin-right: 8px; display: inline-flex;"><i class="fa-solid fa-circle"></i><i class="fa-solid fa-circle"></i><i class="fa-solid fa-circle"></i></span>' 
                : '';
            
            eventEl.innerHTML = `
                <div class="event-line ${isMain ? 'main-line' : 'branch-line'}"></div>
                <div class="event-icon">${icon}</div>
                <div class="event-label">${spinnerHtml}${eventData.label}</div>
            `;
            
            timeline.appendChild(eventEl);
            
            // Animar entrada lateral
            setTimeout(() => {
                eventEl.classList.add('visible');
            }, 50);
            
            // Auto-scroll
            messages.scrollTop = messages.scrollHeight;
        }

        // Remover indicador de "pensando"
        function removeThinkingIndicator() {
            const thinkingEl = document.getElementById('thinking-indicator');
            if (thinkingEl) {
                thinkingEl.remove();
            }
        }

        // Adicionar mensagem do bot com efeito de digitação e suporte a Markdown
        function addBotMessageTyping(text) {
            removeThinkingIndicator();
            
            // Esconder placeholder quando há mensagens
            toggleChatPlaceholder(false);
            
            const el = document.createElement('div');
            el.className = 'message bot typing';
            messages.appendChild(el);
            
            // Renderizar markdown primeiro
            const markdownHtml = window.renderMarkdown(text);
            
            // 🔥 OTIMIZAÇÃO: Se tem componentes MRM, mostrar instantaneamente
            const hasMRMComponents = /@(chart|card|progress)\[/.test(text);
            
            if (hasMRMComponents) {
                console.log('⚡ Componente MRM detectado - renderização instantânea');
                el.classList.remove('typing');
                el.innerHTML = markdownHtml;
                messages.scrollTop = messages.scrollHeight;
                return;
            }
            
            // Criar elemento temporário para extrair apenas o texto para efeito de digitação
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = markdownHtml;
            const plainText = tempDiv.textContent || tempDiv.innerText || text;
            
            // Dividir em palavras para efeito de digitação
            const words = plainText.split(' ');
            let currentIndex = 0;
            
            // Mostrar 3 palavras por vez (efeito de digitação)
            const typingInterval = setInterval(() => {
                const wordsToShow = words.slice(currentIndex, currentIndex + 3);
                
                if (wordsToShow.length > 0) {
                    if (currentIndex === 0) {
                        el.innerText = wordsToShow.join(' ');
                    } else {
                        el.innerText += ' ' + wordsToShow.join(' ');
                    }
                    
                    currentIndex += 3;
                    messages.scrollTop = messages.scrollHeight;
                } else {
                    // Finalizar: remover classe typing e aplicar markdown completo
                    clearInterval(typingInterval);
                    el.classList.remove('typing');
                    el.innerHTML = markdownHtml; // Aplicar markdown renderizado
                    messages.scrollTop = messages.scrollHeight;
                }
            }, 150); // 150ms entre cada grupo de 3 palavras
        }

        // Desabilitar input durante processamento
        function setLoading(isLoading) {
            input.disabled = isLoading;
            sendBtn.disabled = isLoading;
            
            if (isLoading) {
                sendBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                sendBtn.classList.add('clicked');
            } else {
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                sendBtn.classList.remove('clicked');
            }
        }

        // Enviar mensagem para a API e exibir pensamentos reais do agente
        async function sendMessage(messageText) {
            try {
                // VERIFICAR SE ESTÁ NO MODO PLANEJADOR
                if (window.planejador && window.planejador.isAtivo()) {
                    console.log('🎯 Modo planejador ativo - processando mensagem');
                    
                    // Se é a primeira mensagem (objetivo), processar
                    if (window.planejador.contexto.etapa === 'inicial') {
                        await window.planejador.processarObjetivo(messageText);
                        return;
                    }
                    
                    // Se já está completo, permitir perguntas de follow-up
                    if (window.planejador.contexto.etapa === 'completo') {
                        console.log('📝 Pergunta de follow-up no planejamento');
                        // Continuar fluxo normal mas com contexto do planejamento
                    }
                }

                setLoading(true);
                showThinkingIndicator();

                // Obter token de autenticação
                const token = localStorage.getItem('merfin_token');
                if (!token) {
                    throw new Error('Você precisa estar autenticado para usar o chat');
                }

                // Preparar corpo da requisição
                const requestBody = {
                    message: messageText,
                    conversaId: conversaAtualId
                };

                // Se está no modo planejador completo, adicionar contexto
                if (window.planejador && window.planejador.isAtivo() && window.planejador.contexto.etapa === 'completo') {
                    requestBody.planejadorContexto = window.planejador.getContexto();
                }

                // Fazer requisição para obter resposta e pensamentos
                const response = await fetch(`${window.AGENT_API_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                console.log('📦 Resposta recebida:', data);
                console.log('💭 Pensamentos:', data.thoughts);

                if (data.success && data.response) {
                    // Exibir pensamentos reais do agente (se houver)
                    if (data.thoughts && data.thoughts.length > 0) {
                        console.log(`✅ Exibindo ${data.thoughts.length} pensamentos`);
                        await displayThoughts(data.thoughts);
                    } else {
                        console.log('⚠️ Nenhum pensamento recebido - usando fallback');
                        // Fallback: remover indicador se não houver pensamentos
                        removeThinkingIndicator();
                    }
                    
                    addBotMessageTyping(data.response);
                    
                    // Atualizar conversaId retornado pelo servidor
                    if (data.conversaId) {
                        conversaAtualId = data.conversaId;
                        console.log('📌 Conversa ID:', conversaAtualId);
                    }
                    
                    // Salvar mensagens no histórico
                    await salvarMensagemNaConversa('user', messageText);
                    await salvarMensagemNaConversa('assistant', data.response, data.debug?.sectionsUsed, data.debug?.timeframe);
                } else {
                    throw new Error(data.error || 'Erro ao processar mensagem');
                }

            } catch (error) {
                console.error('Erro no chat:', error);
                removeThinkingIndicator();
                addBotMessageTyping('Desculpe, tive um problema ao processar sua mensagem. Verifique se o servidor está rodando e tente novamente. 😔');
            } finally {
                setLoading(false);
            }
        }

        // Exibir pensamentos reais do agente
        async function displayThoughts(thoughts) {
            for (let i = 0; i < thoughts.length; i++) {
                const thought = thoughts[i];
                
                // Adicionar com status "running"
                addTimelineEvent({
                    id: thought.id,
                    label: thought.text,
                    type: thought.type,
                    status: 'running'
                });
                
                // Delay realista (30% mais lento)
                const delay = thought.type === 'main' ? 520 : 325;
                await new Promise(resolve => setTimeout(resolve, delay));
                
                // Marcar como "done"
                addTimelineEvent({
                    id: thought.id,
                    label: thought.text,
                    type: thought.type,
                    status: 'done'
                });
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        // Handler do formulário
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const txt = input.value.trim();
            if (!txt || input.disabled) return;
            
            addUserMessage(txt);
            input.value = '';
            input.style.height = '120px'; // Resetar altura para inicial
            sendMessage(txt);
        });

        // Ctrl/Cmd + Enter enviar
        input.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // Auto-resize do textarea
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.max(Math.min(this.scrollHeight, 400), 120) + 'px';
        });
    })();
    </script>

    <script>
    // Inicializar gráfico de finanças no placeholder
    (function initFinanceChart(){
        // basic state for week navigation
        let financeChartInstance = null;
        let currentWeekOffset = 0; // 0 = current week, -1 = previous week, +1 = next week

        const baseLabels = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
        const baseReceita = [2.5, 3.2, 3.8, 3.1, 3.0, 3.5, 3.8];
        const baseDespesa = [1.8, 2.2, 2.5, 2.0, 1.8, 2.1, 2.3];

        function rotateArray(arr, offset) {
            const len = arr.length;
            const n = ((offset % len) + len) % len;
            return arr.slice(n).concat(arr.slice(0,n));
        }

        function formatWeekLabel(offset) {
            const now = new Date();
            // find Monday of current week
            const day = now.getDay();
            const diffToMonday = (day === 0) ? -6 : (1 - day); // Monday as start
            const monday = new Date(now);
            monday.setDate(now.getDate() + diffToMonday + offset*7);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const opt = { day: '2-digit', month: 'short' };
            const start = monday.toLocaleDateString('pt-BR', opt);
            const end = sunday.toLocaleDateString('pt-BR', opt);
            return `${start} — ${end}`;
        }

        function createOrUpdateChart() {
            const canvas = document.getElementById('financeChart');
            if (!canvas || typeof Chart === 'undefined') return;
            const ctx = canvas.getContext('2d');

            const gradientReceita = ctx.createLinearGradient(0, 0, 0, 400);
            gradientReceita.addColorStop(0, 'rgba(75, 192, 212, 0.3)');
            gradientReceita.addColorStop(1, 'rgba(75, 192, 212, 0)');

            const gradientDespesa = ctx.createLinearGradient(0, 0, 0, 400);
            gradientDespesa.addColorStop(0, 'rgba(255, 99, 132, 0.3)');
            gradientDespesa.addColorStop(1, 'rgba(255, 99, 132, 0)');

            const labels = baseLabels.slice();
            const receita = rotateArray(baseReceita, currentWeekOffset);
            const despesa = rotateArray(baseDespesa, currentWeekOffset);

            const data = {
                labels: labels,
                datasets: [
                    { label: 'Receita', data: receita, borderColor: '#4bc0d4', backgroundColor: gradientReceita, fill:true, tension:0.4, pointRadius:0 },
                    { label: 'Despesa', data: despesa, borderColor: '#e74c3c', backgroundColor: gradientDespesa, fill:true, tension:0.4, pointRadius:0 }
                ]
            };

            const config = { type: 'line', data: data, options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top', labels: { color: '#ccc', usePointStyle: true, pointStyle: 'line' } } },
                scales: { y: { beginAtZero:true, max:4, grid:{ color:'rgba(255,255,255,0.03)' }, ticks:{ color:'#888' } }, x:{ grid:{ display:false }, ticks:{ color:'#888' } } }
            }};

            if (financeChartInstance) {
                try { financeChartInstance.data = data; financeChartInstance.update(); return; } catch(e){}
            }

            financeChartInstance = new Chart(ctx, config);
            // keep reference on canvas for compatibility
            try { canvas._chartInstance = financeChartInstance; } catch(e){}
        }

        function updateWeekDisplay() {
            const el = document.getElementById('finance-current-month-year');
            if (el) el.textContent = formatWeekLabel(currentWeekOffset);
            updateFinanceMonthToggle();
        }

        function updateFinanceMonthToggle() {
            const btn = document.getElementById('finance-month-toggle');
            if (!btn) return;
            const now = new Date();
            const day = now.getDay();
            const diffToMonday = (day === 0) ? -6 : (1 - day);
            const monday = new Date(now);
            monday.setDate(now.getDate() + diffToMonday + currentWeekOffset*7);
            const mid = new Date(monday);
            mid.setDate(monday.getDate() + 3); // mid-week for month label
            const shortMonths = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
            const monthIdx = mid.getMonth();
            const yy = String(mid.getFullYear()).slice(-2);
            const display = `${shortMonths[monthIdx]}/${yy}`;
            const nameEl = btn.querySelector('.month-name');
            const yearEl = btn.querySelector('.month-year-small');
            if (nameEl) nameEl.textContent = display;
            if (yearEl) yearEl.textContent = '';
        }

        function changeWeek(delta) {
            currentWeekOffset += delta;
            createOrUpdateChart();
            updateWeekDisplay();
        }

        function wireControls() {
            const prev = document.getElementById('finance-prev-month');
            const next = document.getElementById('finance-next-month');
            const grid = document.getElementById('finance-month-grid');
            const toggle = document.getElementById('finance-month-toggle');
            const wrapper = document.querySelector('#finance-card .month-dropdown-wrapper');

            if (prev) prev.addEventListener('click', () => changeWeek(-1));
            if (next) next.addEventListener('click', () => changeWeek(1));

            // optional: clicking a month cell updates to first week of that month
            if (grid) {
                document.querySelectorAll('#finance-month-grid .month-cell').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const month = Number(btn.getAttribute('data-month'));
                        const now = new Date();
                        const target = new Date(now.getFullYear(), month, 1);
                        const diffDays = Math.floor((target - now) / (1000*60*60*24));
                        currentWeekOffset = Math.round(diffDays / 7);
                        createOrUpdateChart();
                        updateWeekDisplay();
                        // close grid
                        grid.setAttribute('aria-hidden', 'true');
                        if (toggle) toggle.setAttribute('aria-expanded', 'false');
                    });
                });
            }

            // toggle open/close grid when clicking the month button
            if (toggle && grid) {
                toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const open = grid.getAttribute('aria-hidden') === 'true';
                    grid.setAttribute('aria-hidden', String(!open));
                    toggle.setAttribute('aria-expanded', String(open));
                });
            }

            // close when clicking outside
            document.addEventListener('click', (e) => {
                const wrap = wrapper || document.querySelector('#finance-card .month-dropdown-wrapper');
                if (wrap && !wrap.contains(e.target)) {
                    if (grid) grid.setAttribute('aria-hidden', 'true');
                    if (toggle) toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function init() {
            createOrUpdateChart();
            updateWeekDisplay();
            wireControls();
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 80);
        } else {
            document.addEventListener('DOMContentLoaded', init);
        }
    })();
    </script>
