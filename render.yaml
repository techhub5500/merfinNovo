# Configuração do Render para deploy dos 3 serviços do Merfin.IA
# Este arquivo configura automaticamente os 3 deploys necessários

services:
  # ============================================
  # 1. SERVIDOR OPERACIONAL (Backend Principal)
  # ============================================
  - type: web
    name: merfin-operacional
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node serverOperacional.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false  # Configurar no dashboard do Render
      - key: JWT_SECRET
        sync: false  # Configurar no dashboard do Render
      - key: STRIPE_SECRET_KEY
        sync: false  # Configurar no dashboard do Render
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Configurar no dashboard do Render
      - key: STRIPE_PRICE_ID_BASICO
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
      - key: STRIPE_PRICE_ID_EMPRESARIAL
        sync: false
    healthCheckPath: /api/status

  # ============================================
  # 2. SERVIDOR AGENT (IA e Processamento)
  # ============================================
  - type: web
    name: merfin-agent
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node serverAgent.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPERATIONAL_SERVER_URL
        value: https://merfinoperacional.onrender.com
      - key: JWT_SECRET
        sync: false  # Configurar no dashboard do Render
      - key: OPENAI_API_KEY
        sync: false  # Configurar no dashboard do Render
      - key: SEARCH_API_KEY
        sync: false  # Configurar no dashboard do Render (opcional)
    healthCheckPath: /health

  # ============================================
  # 3. FRONTEND (Cliente Web)
  # ============================================
  # Opção: Usar o servidor operacional para servir o frontend
  # O frontend já está sendo servido pelo servidor operacional
  # URL: https://merfinoperacional.onrender.com/html/index.html
  # 
  # Se quiser um domínio separado para o frontend, crie um 
  # Static Site no Render Dashboard manualmente e aponte para ./client
